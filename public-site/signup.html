<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create your workspace – BizControl</title><meta name="description" content="BizControl: orders, customers, payments, stock and WhatsApp for small businesses. English and Arabic.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 22V10h7a4 4 0 010 8H9' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/site.css"></head>
<body data-page="signup">
<header class="top"><div class="wrap"><a class="logo" href="/">BizControl</a>
<nav><a class="hide" href="/#features" data-t="features">Features</a><a class="hide" href="/pricing" data-t="pricing">Pricing</a><a class="hide demo-link" href="#" data-t="demo">Live demo</a><a class="hide" href="/find" data-t="signin">Sign in</a>
<button class="lang" id="lang" type="button">العربية</button><a class="btn" href="/signup" data-t="start">Start free trial</a></nav></div></header>
<section><div class="wrap"><h2 style="text-align:center" data-t="signupT"></h2><p class="lead" style="text-align:center" data-t="noCard"></p>
<form class="box" id="f" autocomplete="on">
<label data-t="bizname"></label><input name="business" required maxlength="80" autocomplete="organization">
<label data-t="yourname"></label><input name="owner" required maxlength="80" autocomplete="name">
<label data-t="email"></label><input name="email" type="email" required autocomplete="email">
<label data-t="pass"></label><input name="password" type="password" required minlength="12" autocomplete="new-password"><div class="hint" data-t="passHint"></div>
<div class="row2"><div><label data-t="country"></label><select name="country"></select></div><div><label data-t="currency"></label><select name="currency"></select></div></div>
<label data-t="lang"></label><select name="lang"><option value="en">English</option><option value="ar">العربية</option></select>
<label data-t="addr"></label><div class="sub"><input name="subdomain" required pattern="[a-zA-Z0-9\-]{3,30}" placeholder="yourshop" autocapitalize="off"><span id="domain"></span></div><div class="hint" id="subchk"></div>
<label data-t="passcode"></label><input name="pass" autocapitalize="characters" maxlength="24">
<button class="btn big" style="width:100%;margin-top:20px" data-t="create"></button><p class="hint" data-t="terms"></p></form><div id="msg" style="max-width:520px;margin:16px auto 0"></div></div></section>
<footer><div class="wrap"><div class="cols"><div><b>BizControl</b><br>© <span id="yr"></span> · <span data-t="contact">Contact</span>: <a href="mailto:support@bizcontrol.app" style="display:inline">support@bizcontrol.app</a></div>
<div><a href="/terms" data-t="terms_l">Terms</a><a href="/privacy" data-t="privacy_l">Privacy</a><a href="/acceptable-use" data-t="aup_l">Acceptable use</a></div>
<div><a href="/refund" data-t="refund_l">Refunds</a><a href="/cookies" data-t="cookies_l">Cookies</a><a href="/dpa" data-t="dpa_l">Data processing</a></div>
<div><a href="/status" data-t="status_l">Status</a><a href="/find" data-t="find_l">Find my workspace</a></div></div></div></footer>
<script src="/site.js"></script><script src="/yr.js"></script></body></html>
